      <h1 class="jd__title">Souvenir Words | Oslo</h1>
      <p class="jd__date">06.Jul.2025 - 09.Jul.2025</p>
      <p class="jd__intro">Oslo was a city of reassurance.<br>Strangers told me to be patient, that I was already enough,<br>and that life happens while we&rsquo;re busy planning something else.<br>I slowed down, and kept drawing.</p>
    </header>
