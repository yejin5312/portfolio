  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico" sizes="48x48">

  <!-- 상단 바: site.js 에서 모든 페이지 공통으로 불러옵니다 -->
  <script src="site.js" data-slot="header"></script>

  <!-- JOURNAL (테스트 페이지)
       이미지는 images/journal/journal-도시이름.jpg (예: journal-helsinki.jpg) 로 넣어주세요. 각 <figure>의 --r 값이 그 칸의 가로:세로 비율이에요. -->
  <main class="jn">
    <div class="jn__list">
      <!-- 3개의 세로줄(위→아래로 쌓여요). 줄마다 사각형 높이가 달라도 위 칸이 짧으면 아래 칸이 위로 올라와요 -->
      <!-- 코펜하겐~암스테르담: 아직 상세 페이지가 없어 링크 없이 썸네일만 있어요. 날짜(2025)는 임시예요 -->
      <div class="jn__col">
      <figure style="--o:1;--r:31 / 40">
        <a class="jn__link" href="journal-helsinki.html" aria-label="Helsinki, Finland 보기">
          <div class="jn__img"><img src="images/journal/helsinki/journal-helsinki.jpg" alt="Helsinki, Finland" loading="lazy" onerror="if(!this.dataset.t){this.dataset.t=1;this.src='images/journal/journal-helsinki.jpg'}else{this.style.display='none'}"><span class="jn__hover"><span class="jn__hover-txt">Read more</span><svg class="jn__arrow" viewBox="0 0 40 12" width="28" height="9" aria-hidden="true"><path d="M0 6h38M32 1l6 5-6 5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
          <figcaption>Helsinki, Finland<span>2025</span></figcaption>
        </a>
      </figure>
