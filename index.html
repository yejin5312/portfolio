<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yejin Lee</title>
  <meta name="description" content="Yejin Lee — Portfolio. Based in Seoul.">
  <meta property="og:title" content="Yejin Lee">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yejin5312.com">
  <!-- 공유 미리보기 이미지가 생기면 아래 주석을 풀고 경로를 맞추세요 -->
  <!-- <meta property="og:image" content="https://yejin5312.com/images/og.png"> -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 상단 바: site.js 에서 모든 페이지 공통으로 불러옵니다 -->
  <script src="site.js" data-slot="header"></script>

  <main class="works">
    <!--
      이미지는 images 폴더에 work-01.png ~ work-08.png 로 넣어주세요.
      <figcaption> 안의 글자가 마우스를 올렸을 때 나오는 프로젝트 이름이에요.
    -->
    <figure class="work work--light">
      <a class="work__link" href="contain.html" aria-label="CONTAIN | VASE 프로젝트 보기">
        <img src="images/work-01.png" alt="CONTAIN | VASE" loading="lazy" onerror="this.style.display='none'">
      </a>
      <figcaption class="work__title">CONTAIN | VASE</figcaption>
    </figure>
    <figure class="work work--light">
      <a class="work__link" href="pony.html" aria-label="PONY | STOOL 프로젝트 보기">
        <img src="images/work-02.png" alt="PONY | STOOL" loading="lazy" onerror="this.style.display='none'">
      </a>
      <figcaption class="work__title">PONY | STOOL</figcaption>
    </figure>
    <figure class="work">
      <a class="work__link" href="o-nest.html" aria-label="O-NEST | LIGHTING 프로젝트 보기">
        <img src="images/work-03.png" alt="O-NEST | LIGHTING" loading="lazy" onerror="this.style.display='none'">
      </a>
      <figcaption class="work__title">O-NEST | LIGHTING</figcaption>
    </figure>
    <figure class="work">
      <img src="images/holiday2026.png" alt="HOLIDAY 2026 | Ornament" loading="lazy" onerror="this.style.display='none'">
      <figcaption class="work__title">HOLIDAY 2026 | Ornament</figcaption>
    </figure>
    <figure class="work work--mid">
      <img src="images/work-06.png" alt="PILE | Side Table" loading="lazy" onerror="this.style.display='none'">
      <figcaption class="work__title">PILE | Side Table</figcaption>
    </figure>
    <figure class="work work--light">
      <img src="images/gyeop.png" alt="GYEOP | Tableware" loading="lazy" onerror="this.style.display='none'">
      <figcaption class="work__title">GYEOP | Tableware</figcaption>
    </figure>
    <figure class="work work--light">
      <img src="images/rustle.png" alt="RUSTLE | Cleaning Tools" loading="lazy" onerror="this.style.display='none'">
      <figcaption class="work__title">RUSTLE | Cleaning Tools</figcaption>
    </figure>
  </main>

  <!-- 하단 정보 바: site.js 에서 모든 페이지 공통으로 불러옵니다 -->
  <script src="site.js" data-slot="footer"></script>
